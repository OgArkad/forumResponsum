<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Responsum</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="Title">Forum Responsum</h1>
    <div id="boxes">
        <div id="chatBox" class="forumBox">
            <p class="boxName">Chat</p>

            <select name="channel" id="channelsChat">
                <option value="general">General</option>
                <option value="answers">Answers</option>
                <option value="memes">Memes</option>
                <option value="adminPanel">admin</option>
            </select>

            <div class="message" id="msg1">
                
            </div>

            <div id="messagePanel">
                <input type="text" placeholder="Write your text here!" id="inputMessage">
                <button id="sendButton">send</button>
            </div>
        </div>
        <div id="newsBox" class="forumBox">
            <p id="newsBox" class="boxName">News</p>
            <div class="newsBlock">
                <p class="newsTitle">Tech updates:</p>
                <p class="newsText">-I made the news blocks in the center</p>
            </div>
            <div class="newsBlock">
                <p class="newsTitle">Todo list:</p>
                <p class="newsText">-create design for input and send</p>
                <p class="newsText">-create tagging system for messages</p>
                <p class="newsText">-find something useful for the space of etc</p>
            </div>
        </div>
    </div>
</body>
</html>
